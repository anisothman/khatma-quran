
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ختمة القرآن الكريم</title>

  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header>
  <h1>📖 ختمة القرآن الكريم</h1>
  <p>متابعة القراءة الأسبوعية</p>
</header>

<main class="container">

  <!-- معلومات الختمة -->
  <section class="card center">
    <div class="badge" id="weekName">الأسبوع 1</div>
    <p>بعد إتمام قراءة الحزبين المخصصين لك، اختر اسمك واضغط «تمّ».</p>
  </section>

  <!-- تسجيل الإتمام -->
  <section class="card">
    <h2>✅ تسجيل الإتمام</h2>

    <select id="participant">
      <option value="">-- اختر اسمك --</option>
    </select>

    <button class="primary" id="doneBtn">
      تمّ إنجاز الحزبين ✅
    </button>

    <div id="message" aria-live="polite"></div>
  </section>

  <!-- الإحصائيات -->
  <section class="card">
    <div class="stats">
      <div>
        <strong id="done">0</strong>
        <span>أكملوا</span>
      </div>

      <div>
        <strong id="left">0</strong>
        <span>متبقون</span>
      </div>

      <div>
        <strong id="percent">0%</strong>
        <span>نسبة الإنجاز</span>
      </div>
    </div>

    <div class="bar">
      <div id="bar"></div>
    </div>
  </section>

  <!-- حالة المجموعة -->
  <section class="card">
    <h2>👥 حالة المجموعة</h2>
    <div id="list" class="list"></div>
  </section>

  <!-- دخول المشرف -->
  <section class="card center">
    <a class="admin-link" href="admin.html">
      🔐 دخول المشرف
    </a>
  </section>

</main>

<script>
"use strict";

/* =========================
   إعداد Supabase
========================= */

const SUPABASE_URL =
  "https://ajdhuxavcsgythitombr.supabase.co";

/*
  استعمل مفتاح anon / publishable الأصلي
  الموجود في ملفك السابق.
  لا تستعمل service_role أو secret key هنا.
*/
const SUPABASE_ANON_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInJlZiI6ImFqZGh1eGF2c2d5dGhpdG9tYnIiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc5MTQ2ODExNywiZXhwIjoyMTA3MDQ0MTE3fQ.9uexJt74s1UTfsoVeBdd2pfGaCoXO823fWyTJVtBflo";

const sb = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

let currentWeek = 1;
let loading = false;

/* =========================
   عرض الأخطاء
========================= */

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[char]);
}

function showError(message) {
  const msg = document.getElementById("message");

  msg.innerHTML =
    '<div class="warning">تعذر تحميل البيانات: ' +
    escapeHtml(message) +
    "</div>";

  console.error("Supabase error:", message);
}

/* =========================
   تحميل البيانات
========================= */

async function load() {
  if (loading) return;
  loading = true;

  try {
    const {
      data: settings,
      error: settingsError
    } = await sb
      .from("khatma_settings")
      .select("*")
      .eq("id", 1)
      .single();

    if (settingsError) {
      showError(settingsError.message);
      return;
    }

    currentWeek = settings.current_week;

    // عرض رقم الأسبوع فقط.
    // لا يوجد عنصر id="hizb" في HTML.
    document.getElementById("weekName").textContent =
      "الأسبوع " + currentWeek;

    /* المشاركون */

    const {
      data: people,
      error: peopleError
    } = await sb
      .from("participants")
      .select("id,name,current_hizb_1,current_hizb_2")
      .eq("active", true)
      .order("id");

    if (peopleError) {
      showError(peopleError.message);
      return;
    }

    /* القراءات المكتملة للأسبوع الحالي */

    const {
      data: doneRows,
      error: completionError
    } = await sb
      .from("week_completions")
      .select("participant_id,completed,completed_at")
      .eq("week_number", currentWeek)
      .eq("completed", true);

    if (completionError) {
      showError(completionError.message);
      return;
    }

    const participants = people || [];
    const completions = doneRows || [];

    const doneSet = new Set(
      completions.map(row => String(row.participant_id))
    );

    /* قائمة اختيار الاسم */

    const select = document.getElementById("participant");
    const previousValue = select.value;

    select.innerHTML =
      '<option value="">-- اختر اسمك --</option>';

    participants.forEach(person => {
      const option = document.createElement("option");

      option.value = person.id;

      option.textContent =
        `${person.name} (${person.current_hizb_1}/${person.current_hizb_2})`;

      if (doneSet.has(String(person.id))) {
        option.disabled = true;
      }

      select.appendChild(option);
    });

    // الاحتفاظ بالاختيار إن كان المشارك لم يكمل بعد.
    if (
      previousValue &&
      participants.some(person =>
        String(person.id) === previousValue &&
        !doneSet.has(previousValue)
      )
    ) {
      select.value = previousValue;
    }

    /* الإحصائيات */

    const doneCount = participants.filter(person =>
      doneSet.has(String(person.id))
    ).length;

    const remaining = Math.max(0, participants.length - doneCount);

    const percentage = participants.length
      ? Math.round(doneCount / participants.length * 100)
      : 0;

    document.getElementById("done").textContent = doneCount;
    document.getElementById("left").textContent = remaining;
    document.getElementById("percent").textContent = percentage + "%";
    document.getElementById("bar").style.width = percentage + "%";

    /* حالة المجموعة */

    document.getElementById("list").innerHTML =
      participants.map(person => {
        const completed = doneSet.has(String(person.id));

        return `
          <div class="person ${completed ? "done" : ""}">
            <span>
              ${completed ? "✅" : "⏳"}
              ${escapeHtml(person.name)}
              <strong>
                (${escapeHtml(person.current_hizb_1)}/${escapeHtml(person.current_hizb_2)})
              </strong>
            </span>

            <b>${completed ? "تمّ" : "لم يتم"}</b>
          </div>
        `;
      }).join("");

    // مسح رسالة الخطأ السابقة بعد نجاح التحميل.
    const msg = document.getElementById("message");

    if (msg.querySelector(".warning")) {
      msg.innerHTML = "";
    }

  } catch (error) {
    showError(error.message || "حدث خطأ غير متوقع");
  } finally {
    loading = false;
  }
}

/* =========================
   تسجيل إتمام القراءة
========================= */

document.getElementById("doneBtn").addEventListener("click", async () => {
  const select = document.getElementById("participant");
  const msg = document.getElementById("message");
  const button = document.getElementById("doneBtn");

  const id = select.value;

  if (!id) {
    msg.innerHTML =
      '<div class="warning">اختر اسمك أولاً.</div>';
    return;
  }

  button.disabled = true;
  msg.textContent = "جارٍ تسجيل الإتمام...";

  try {
    const { error } = await sb.rpc("mark_my_completion", {
      p_participant_id: Number(id)
    });

    if (error) {
      showError(error.message);
      return;
    }

    msg.innerHTML =
      '<div class="success">✅ تم تسجيل إتمامك بنجاح.</div>';

    await load();

  } catch (error) {
    showError(error.message || "تعذر تسجيل الإتمام");
  } finally {
    button.disabled = false;
  }
});

/* =========================
   التشغيل والتحديث المباشر
========================= */

load();

sb.channel("khatma-live")
  .on(
    "postgres_changes",
    {
      event: "*",
      schema: "public",
      table: "week_completions"
    },
    () => load()
  )
  .on(
    "postgres_changes",
    {
      event: "*",
      schema: "public",
      table: "khatma_settings"
    },
    () => load()
  )
  .on(
    "postgres_changes",
    {
      event: "*",
      schema: "public",
      table: "participants"
    },
    () => load()
  )
  .subscribe();
</script>

</body>
</html>
